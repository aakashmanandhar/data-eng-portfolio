version: 2
models:
  - name: silver_so_survey_historical
    columns:
      - name: survey_year
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: canonical_tool
        tests:
          - not_null
      - name: tool_category
        tests:
          - not_null
          - accepted_values:
              values: ['language', 'database', 'platform']
  - name: silver_practical_data_survey
    columns:
      - name: respondent_id
        tests:
          - unique
          - not_null
      - name: role
        tests:
          - not_null
  - name: silver_ai_jobs_salaries
    columns:
      - name: work_year
        tests:
          - not_null
      - name: experience_level
        tests:
          - not_null
          - accepted_values:
              values: ['EN', 'MI', 'SE', 'EX']
      - name: employment_type
        tests:
          - not_null
          - accepted_values:
              values: ['CT', 'FL', 'FT', 'PT']
      - name: salary_in_usd
        tests:
          - not_null
      - name: remote_ratio
        tests:
          - not_null
          - accepted_values:
              values: [0, 50, 100]
      - name: company_size
        tests:
          - not_null
          - accepted_values:
              values: ['S', 'M', 'L']
  - name: silver_research_papers
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_research_repos
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_research_hn
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_pypi_trends
    columns:
      - name: tool_name
        tests:
          - not_null
  - name: silver_semantic_scholar_papers
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_openalex_papers
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_crossref_papers
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_dblp_papers
    columns:
      - name: external_id
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
  - name: silver_hf_papers
    columns:
