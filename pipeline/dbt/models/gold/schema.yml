version: 2
models:
  - name: dim_country
    columns:
      - name: country_code
        tests:
          - unique
      - name: country_name
        tests:
          - unique
          - not_null
  - name: dim_tool
    columns:
      - name: tool_name
        tests:
          - unique
          - not_null
  - name: fact_job_market
    columns:
      - name: country_name
        tests:
          - not_null
      - name: seniority_level
        tests:
          - not_null
          - accepted_values:
              values: ['entry', 'mid', 'senior']
      - name: job_count
        tests:
          - not_null
  - name: dim_github_repo
    columns:
      - name: repo_full_name
        tests:
          - unique
          - not_null
      - name: cohort
        tests:
          - not_null
      - name: stars
        tests:
          - not_null
  - name: fact_github_repo_trend
    columns:
      - name: repo_full_name
        tests:
          - not_null
      - name: cohort
        tests:
          - not_null
      - name: stars
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
  - name: fact_github_org_trend
    columns:
      - name: org_name
        tests:
          - not_null
      - name: aggregate_stars
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
  - name: dim_github_org
    columns:
      - name: org_name
        tests:
          - unique
          - not_null
      - name: aggregate_stars
        tests:
          - not_null
  - name: fact_ai_adoption_signal
    columns:
      - name: cohort
        tests:
          - not_null
          - accepted_values:
              values: ['ai', 'traditional']
      - name: snapshot_date
        tests:
          - not_null
  - name: fact_country_ai_signal
    columns:
      - name: country_code
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
      - name: ai_stargazers
        tests:
          - not_null
      - name: traditional_stargazers
        tests:
          - not_null
      - name: total_stargazers
        tests:
          - not_null
      - name: ai_share_pct
        tests:
          - not_null

  - name: fact_country_tool_signal
    columns:
      - name: repo_full_name
        tests:
          - not_null
      - name: cohort
        tests:
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: stargazers
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
  - name: fact_de_tool_by_country_year
    columns:
      - name: survey_year
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: canonical_tool
        tests:
          - not_null
      - name: usage_pct
        tests:
          - not_null
  - name: fact_de_tool_ranking
    columns:
      - name: rank_in_country
        tests:
          - not_null
      - name: rank_overall
        tests:
          - not_null
  - name: fact_salary_by_experience
    columns:
      - name: work_year
        tests:
          - not_null
      - name: experience_level
        tests:
          - not_null
      - name: median_salary_usd
        tests:
          - not_null
  - name: fact_salary_by_tool
    columns:
      - name: canonical_tool
        tests:
          - not_null
      - name: job_title
        tests:
          - not_null
  - name: fact_top_paying_title_by_year
    columns:
      - name: work_year
        tests:
          - not_null
          - unique
      - name: job_title
        tests:
          - not_null
  - name: dim_research_source
    columns:
      - name: source_id
        tests:
          - unique
          - not_null
      - name: source_name
        tests:
          - unique
          - not_null
  - name: fact_research_signal
    columns:
      - name: external_id
        tests:
          - not_null
      - name: title
        tests:
          - not_null
      - name: source_name
        tests:
          - not_null
          - accepted_values:
              values: ['arxiv', 'github', 'hackernews', 'semantic_scholar', 'openalex', 'crossref', 'dblp', 'hf_papers', 'zenodo']
  - name: fact_tool_adoption
    columns:
      - name: tool_name
        tests:
          - not_null
      - name: last_month_downloads
        tests:
          - not_null
